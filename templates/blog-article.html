<!-- HeyNaj Flow standard blog template.
Generate each approved article at /blog/<slug>/index.html.
Replace every {{PLACEHOLDER}} before publishing. Keep visible article text in HTML.
Required SEO fields: title, meta description, canonical URL, OG image, Article JSON-LD, image alt text.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <link rel="canonical" href="https://heynajflow.com/blog/{{SLUG}}/">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="https://heynajflow.com/blog/{{SLUG}}/">
  <meta property="og:image" content="{{HERO_IMAGE_URL}}">
  <script type="application/ld+json">{{ARTICLE_JSON_LD}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-white text-slate-900">
  <main class="mx-auto max-w-3xl px-6 py-12">
    <a href="/blog/" class="text-sm font-semibold text-blue-600">← HeyNaj Flow Blog</a>
    <article class="mt-8">
      <p class="text-sm font-semibold text-slate-500">{{PUBLISHED_DATE}} · {{READ_TIME}}</p>
      <h1 class="mt-3 text-4xl font-extrabold leading-tight sm:text-5xl">{{TITLE}}</h1>
      <p class="mt-5 text-xl leading-8 text-slate-600">{{SUMMARY}}</p>
      <img class="mt-10 w-full rounded-2xl" src="{{HERO_IMAGE_URL}}" alt="{{HERO_IMAGE_ALT}}" loading="eager">
      <div class="prose prose-slate mt-10 max-w-none">
        {{ARTICLE_HTML}}
      </div>
    </article>
  </main>
</body>
</html>
