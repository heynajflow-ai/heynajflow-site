            overflow-x: hidden;

            background-size: 18px 18px;
            mask-image: radial-gradient(circle at center, black 45%, transparent 100%);
            z-index: -2;
        }

        .ambient-orb {
            position: fixed;
            border-radius: 999px;
            filter: blur(50px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.8;
        }

        .ambient-orb.one {
            width: 300px;
            height: 300px;
            top: 80px;
            left: -60px;
            background: rgba(255, 220, 50, 0.16);
        }

        .ambient-orb.two {
            width: 260px;
            height: 260px;
            top: 45%;
            right: -70px;
            background: rgba(255, 255, 255, 0.62);
        }

        .nav-shell {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: 0 20px 60px -35px rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-card {
            background: var(--hn-surface);
            border: 1px solid rgba(255, 255, 255, 0.78);
            box-shadow: var(--hn-shadow);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }

        .glass-card-soft {
            background: rgba(255, 255, 255, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: 0 24px 60px -38px rgba(17, 24, 39, 0.28);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid rgba(17, 24, 39, 0.08);
            box-shadow: 0 12px 26px -22px rgba(15, 23, 42, 0.45);
            font-size: 0.74rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #3e4652;
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
        }

        .hero-kicker-dot,
        .section-badge-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 999px;
            background: var(--hn-yellow);
            box-shadow: 0 0 0 6px rgba(255, 220, 50, 0.18);
            flex: 0 0 auto;
        }

        .cta-primary {
            background: linear-gradient(180deg, #ffe45e 0%, #ffdc32 100%);
            color: #111827;
            box-shadow: var(--hn-glow);
        }

        .cta-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 26px 70px -30px rgba(255, 220, 50, 0.9);
        }

        @keyframes breathe-glow {
            0%, 100% {
                transform: translateY(0) scale(1);
                box-shadow: 0 22px 60px -24px rgba(255, 220, 50, 0.62);
            }
            50% {
                transform: translateY(-1px) scale(1.02);
                box-shadow: 0 30px 78px -22px rgba(255, 220, 50, 0.92);
            }
        }

        .cta-breathe {
            animation: breathe-glow 2.4s ease-in-out infinite;
        }

        .cta-secondary:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 220, 50, 0.6);
        }

        .quiet-link:hover {
            color: #111827;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(300px, 420px);
            gap: 3.5rem;
            align-items: center;
        }

        .hero-note {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .hero-chip {
            padding: 0.85rem 1rem;
            border-radius: 1.2rem;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(17, 24, 39, 0.08);
            color: #303846;
            font-size: 0.86rem;
            font-weight: 700;
            box-shadow: 0 18px 30px -28px rgba(15, 23, 42, 0.45);
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
        }

        .micro-glow:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 220, 50, 0.48);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 24px 54px -28px rgba(255, 220, 50, 0.88);
        }

        .phone-frame {
            width: min(100%, 360px);
            margin: 0 auto;
            padding: 0.85rem;
            border-radius: 3rem;
            background: linear-gradient(180deg, #101010 0%, #1d1d1d 100%);
            box-shadow: 0 50px 90px -40px rgba(15, 23, 42, 0.55), var(--hn-glow);
            position: relative;
        }

        .phone-notch {
            width: 120px;
            height: 28px;
            border-radius: 999px;
            background: #0a0a0a;
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .phone-screen {
            height: 680px;
            border-radius: 2.3rem;
            background: linear-gradient(180deg, #f9fafc 0%, #eef1f7 100%);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .mock-app-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(17, 24, 39, 0.06);
        }

        .typing-dots span {
            width: 5px;
            height: 5px;
            display: inline-block;
            border-radius: 999px;
            background: #8b93a2;
            animation: typing-bounce 1.3s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.32s; }

        @keyframes typing-bounce {
            0%, 80%, 100% { transform: scale(0.2); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .toast-pop {
            animation: toast-rise 1.1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes toast-rise {
            0% { opacity: 0; transform: translateY(18px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .pop-entry {
            opacity: 0;
            transform: translateY(28px) scale(0.985);
            transition: opacity 0.75s ease, transform 0.75s ease;
        }

        .pop-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

            mask-image: linear-gradient(90deg, transparent, black 10%, black 90%, transparent);

        }

            background: var(--hn-yellow);
            box-shadow: 0 0 0 8px rgba(255, 220, 50, 0.12);

            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 1.25rem;
        }

            position: relative;
            overflow: hidden;
            padding: 1.5rem;
            border-radius: 2rem;
            min-height: 260px;
            display: flex;
            flex-direction: column;

            content: "";

        .cap-demo {

            border: 1px solid rgba(17, 24, 39, 0.08);

        .bar-stack span {
            width: 8px;
            border-radius: 999px;
            background: linear-gradient(180deg, #111827 0%, #8f96a3 100%);

            display: inline-block;
        }

        .bar-stack span:nth-child(1) { height: 18px; animation-delay: 0s; }

        .bar-stack span:nth-child(5) { height: 20px; animation-delay: 0.48s; }

        @keyframes voice-wave {
            0%, 100% { transform: scaleY(0.55); opacity: 0.65; }
            50% { transform: scaleY(1.08); opacity: 1; }
        }

        .status-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;

            border-radius: 999px;

            color: #111827;

        .status-toggle::before {
            content: "";
            width: 2.5rem;
            height: 1.5rem;

            background: rgba(255, 220, 50, 0.35);
            box-shadow: inset 0 0 0 1px rgba(17, 24, 39, 0.05);

        .status-toggle::after {
            content: "";
            width: 1rem;
            height: 1rem;

            background: var(--hn-yellow);

            left: -2rem;
            box-shadow: 0 10px 20px -12px rgba(255, 220, 50, 0.9);
        }

        .command-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.5rem;
        }

        .command-panel {
            padding: 1.5rem;
            border-radius: 2rem;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .command-ui {
            flex: 1;

            flex-direction: column;
            justify-content: flex-start;

            align-items: stretch;

        .pricing-grid {

            gap: 1.5rem;

        }

        .price-card {
            border-radius: 2.2rem;
            padding: 1.75rem;

            flex-direction: column;
            min-height: 100%;
        }

        .price-card.featured {
            background: linear-gradient(180deg, #171717 0%, #212121 100%);
            color: white;
            box-shadow: 0 40px 80px -44px rgba(17, 24, 39, 0.65), var(--hn-glow);
            transform: translateY(-10px);
        }

        .price-card .feature-line {
            display: flex;
            gap: 0.7rem;
            align-items: flex-start;
        }

        .loader-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .footer-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.18fr) minmax(0, 0.82fr);
            gap: 1.25rem;
            align-items: start;
        }

                                        <div class="real-shot-frame remote-thumb">
                                            <img :src="config.shot_widget_settings" alt="Widget settings preview" class="real-shot-image remote-thumb-image">
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
        </section>

        <section id="live-demo-setup" class="py-16 md:py-24">
            <div class="max-w-7xl mx-auto pop-entry" x-data="{ scraping: false, scraped: false, url: '', demoText: '',
                runScraper() {
                    let finalUrl = this.url.trim();
                    if (!finalUrl) return;
                    if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) finalUrl = 'https://' + finalUrl;
                    this.scraping = true;
                    this.scraped = false;
                    fetch('https://script.google.com/macros/s/AKfycbybNgIc64SnrZQTv4a-c5rTplxrqRPrbxg5oKNLgExdpdt0kr0a2OXco9-inYkdZUg6yg/exec', {
                        method: 'POST',
                        mode: 'cors',
                        credentials: 'omit',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ type: 'scrape_demo', targetUrl: finalUrl })
                    })
                    .then(async res => {
                        const raw = await res.text();
                        try { return JSON.parse(raw); } catch (e) { throw new Error('Response error.'); }
                    })
                    .then(data => {
                        this.scraping = false;
                        this.scraped = true;
                        if (data.error) {
                            this.demoText = 'Warning: ' + data.error;
                        } else {
                            window.hnScrapedContext = data.extractedText || '';
                            const cleanDisplay = (data.extractedText || '').replace(/\\*\\*/g, '').replace(/#/g, '');
                            this.demoText = 'Analyzing: ' + finalUrl + '\\n\\n' + cleanDisplay + '\\n\\nSystem ready. Chat with your custom AI below.';
                        }
                    })
                    .catch(() => {
                        this.scraping = false;
                        this.scraped = true;
                        this.demoText = 'Warning: Connection failed. Please try again.';
                    });
                }
            }">
                <div class="glass-card hover-pop rounded-[2.2rem] p-8 md:p-10">
                    <div class="section-badge mb-6">
                        <span class="section-badge-dot"></span>
                        <span x-text="config.scrape_badge || 'Live Demo Setup'"></span>
                    </div>
                    <h2 class="text-4xl md:text-5xl font-extrabold tracking-[-0.05em] leading-tight text-slate-900" x-text="config.scrape_title"></h2>
                    <p class="mt-5 max-w-5xl text-lg font-medium leading-relaxed text-slate-600" x-text="config.scrape_desc"></p>

                    <template x-if="!scraped && !scraping">
                        <div class="mt-8">
                            <form @submit.prevent="runScraper()" class="flex flex-col md:flex-row gap-4">
                                <input type="text" x-model="url" required placeholder="yourwebsite.com"
                                       class="flex-1 px-6 py-5 rounded-[1.4rem] border border-slate-300 shadow-inner focus:outline-none focus:border-[#ffdc32] focus:ring-4 focus:ring-[#ffdc32]/20 text-slate-800 bg-white placeholder-slate-400 font-semibold transition-all">
                                <button type="submit" class="cta-primary transition px-8 py-5 rounded-[1.4rem] font-extrabold whitespace-nowrap" x-text="config.scrape_button || 'Extract Knowledge'"></button>
                            </form>
                        </div>
                    </template>

                    <div x-show="scraping" x-transition.opacity class="py-10 text-center">
                        <div class="w-14 h-14 mx-auto border-4 border-slate-200 border-t-[#ffdc32] rounded-full animate-spin shadow-[0_0_50px_rgba(255,220,50,0.35)]"></div>
                        <div class="mt-5 text-lg font-extrabold text-slate-700">Extracting business context...</div>
                    </div>

                    <div x-show="scraped" x-transition.opacity x-cloak class="mt-8">
                        <div class="flex items-center gap-2 mb-4">
                            <div class="w-3 h-3 rounded-full bg-slate-300"></div>
                            <div class="w-3 h-3 rounded-full bg-slate-300"></div>
                            <div class="w-3 h-3 rounded-full bg-slate-300"></div>
                            <span class="text-xs font-extrabold text-slate-500 uppercase tracking-[0.22em] ml-2">Extraction Complete</span>
                        </div>
                        <div class="bg-slate-50 rounded-[1.6rem] p-6 text-sm md:text-base text-slate-700 leading-relaxed shadow-inner max-h-96 overflow-y-auto border border-slate-200 font-medium">
                            <pre x-text="demoText" class="whitespace-pre-wrap font-sans"></pre>
                        </div>
                        <div class="mt-8 flex flex-col sm:flex-row gap-4">
                            <button @click="injectAndOpen()" class="cta-primary transition px-8 py-5 rounded-full font-extrabold text-base text-center flex-1" x-text="config.scrape_ready_cta || 'Chat With Your Custom AI Now'"></button>
                            <button @click="scraped = false; url = ''" class="cta-secondary transition px-8 py-5 rounded-full font-extrabold text-base border border-slate-300 bg-white/70 flex-1">Try Another Website</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="product-demo" class="py-16 md:py-24">
            <div class="max-w-7xl mx-auto pop-entry">
                <div class="glass-card hover-pop rounded-[2.4rem] p-8 md:p-10 overflow-hidden">
                    <div class="max-w-4xl">
                        <div class="section-badge mb-6">
                            <span class="section-badge-dot"></span>
                            <span x-text="config.video_badge || 'Product Demo'"></span>
                        </div>
                        <h2 class="text-4xl md:text-5xl font-extrabold tracking-[-0.05em] leading-tight text-slate-900" x-text="config.video_title"></h2>
                        <p class="mt-4 max-w-5xl text-lg font-medium leading-relaxed text-slate-600" x-html="config.video_desc_html"></p>
                    </div>

                    <div class="mt-10 relative max-w-5xl mx-auto aspect-video rounded-[2rem] overflow-hidden shadow-[0_35px_80px_-45px_rgba(17,24,39,0.7)] border border-slate-200 bg-black">
                        <video controls preload="metadata"
                               poster="https://res.cloudinary.com/dt5j91krt/image/upload/q_auto/f_auto/v1776513358/HeyNaj_Demo_Thumbnail_yaonad.png"
                               src="https://res.cloudinary.com/dt5j91krt/video/upload/v1776495383/HeyNaj_Flow_-_Demo_1080p_c8ojgj.mp4"
                               :poster="config.video_poster_url || 'https://res.cloudinary.com/dt5j91krt/image/upload/q_auto/f_auto/v1776513358/HeyNaj_Demo_Thumbnail_yaonad.png'"
                               :src="config.video_src || 'https://res.cloudinary.com/dt5j91krt/video/upload/v1776495383/HeyNaj_Flow_-_Demo_1080p_c8ojgj.mp4'"
                               x-effect="if (config.video_src || config.video_poster_url) { $el.load(); }"
                               class="w-full h-full object-contain bg-black">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                </div>
            </div>
        </section>

        <section id="pricing" class="pt-10 md:pt-14 pb-16 md:pb-24">
            <div class="max-w-7xl mx-auto">
                <div class="text-center pop-entry">
                    <div class="inline-flex items-center gap-3 glass-card-soft micro-glow hover-pop rounded-full px-6 md:px-10 py-4 border border-[#ffdc32]/45">

                    <h2 class="mt-8 text-4xl md:text-6xl font-extrabold tracking-[-0.05em] leading-tight text-slate-900" x-text="config.price_title"></h2>
                    <p class="mt-5 max-w-5xl mx-auto text-lg md:text-xl font-medium leading-relaxed text-slate-600" x-html="config.price_intro_html"></p>
                </div>

                <div class="pricing-grid mt-14">
                    <template x-for="plan in (config.plans || [])" :key="plan.name">
                        <article class="price-card hover-pop pop-entry h-full" :class="plan.featured ? 'featured' : 'glass-card'">
                            <div class="plan-title-wrap">
                                <div class="text-[0.7rem] uppercase tracking-[0.24em] font-extrabold" :class="plan.featured ? 'text-white/60' : 'text-slate-400'" x-text="plan.eyebrow"></div>
                                <h3 x-show="plan.name" class="mt-3 text-[1.7rem] md:text-[1.8rem] leading-tight font-extrabold tracking-tight whitespace-nowrap" x-text="plan.name"></h3>
                                <div x-show="plan.featured" class="mt-3">
                                    <span class="plan-feature-pill" x-text="config.price_featured_pill || 'Most Popular'"></span>
                                </div>
                            </div>

                            <div class="plan-price-wrap mt-6 text-4xl md:text-5xl font-extrabold tracking-tight leading-tight" x-html="plan.price"></div>
                            <p class="plan-subtitle-wrap mt-4 text-sm md:text-base font-medium leading-relaxed" :class="plan.featured ? 'text-white/70' : 'text-slate-500'" x-html="plan.subtitle"></p>

                            <div class="plan-pilot-wrap mt-5 rounded-[1.2rem] px-4 py-3 font-extrabold text-sm" :class="plan.featured ? 'bg-white/8 text-[#ffdc32] border border-white/10' : 'bg-[#ffdc32]/18 text-slate-900 border border-[#ffdc32]/30'">
                                <span x-text="plan.pilot"></span>
                            </div>

                            <div class="mt-8 space-y-4 flex-1">
                                <template x-for="feature in plan.features" :key="feature">
                                    <div class="feature-line">
                                        <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-extrabold flex-shrink-0" :class="plan.featured ? 'bg-white/10 text-[#ffdc32]' : 'bg-[#ffdc32]/22 text-slate-900'">&#10003;</span>
                                        <span class="text-sm md:text-base font-medium leading-relaxed" :class="plan.featured ? 'text-white/78' : 'text-slate-600'" x-html="feature"></span>
                                    </div>
                                </template>
                            </div>

                            <a :href="config.cta_link || '#'" target="_blank" class="mt-10 text-center rounded-full px-6 py-4 text-base font-extrabold transition w-full" :class="plan.featured ? 'cta-primary' : 'cta-secondary bg-white/70 border border-slate-300'">
                                <span x-text="plan.cta"></span>
                            </a>
                        </article>
                    </template>
                </div>
            </div>
        </section>
    </main>

    <footer class="pt-6 pb-12 px-6 md:px-8">

            <div class="footer-grid slim">

                    <div class="flex items-center gap-3">

                        <span x-text="config.cta_text || config.hero_primary_cta || 'Start Free Pilot'"></span>
                    </a>
                    <div class="text-right text-[0.7rem] uppercase tracking-[0.22em] font-extrabold text-slate-400">

        </div>
        <div class="max-w-4xl mx-auto mt-6 px-3">

                <a href="/terms-of-service.html" class="underline underline-offset-[5px] decoration-slate-300 decoration-[1.5px] hover:text-slate-600 hover:decoration-slate-500 transition">Terms of Service</a>
                <a href="/privacy-policy.html" class="underline underline-offset-[5px] decoration-slate-300 decoration-[1.5px] hover:text-slate-600 hover:decoration-slate-500 transition">Privacy Policy</a>
                <a href="/data-handling-policy.html" class="underline underline-offset-[5px] decoration-slate-300 decoration-[1.5px] hover:text-slate-600 hover:decoration-slate-500 transition">Data Handling Policy</a>
            </div>
        </div>
    </footer>

    <div id="real-widget-container"></div>
</body>
