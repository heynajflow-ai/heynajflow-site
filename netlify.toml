[build]
  publish = "."

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "/data-handling-policy"
  to = "/data-handling-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "/data-handling-policy/"
  to = "/data-handling-policy.html"
  status = 301
  force = true

[[redirects]]
  from = "/book"
  to = "/book/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/book/"
  to = "/book/index.html"
  status = 200
  force = false

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/blog/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"
