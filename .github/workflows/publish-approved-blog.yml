name: Publish approved blog

on:
  repository_dispatch:
    types: [publish-approved-blog]

permissions:
  contents: write

concurrency:
  group: publish-approved-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render approved article and indexes
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/publish-approved-blog.mjs
      - name: Commit generated site
        run: |
          git config user.name "HeyNaj Flow Blog Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add blog data/blog-registry.json data/blog-published.json index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Publish blog: ${{ github.event.client_payload.slug }}"
          git push
